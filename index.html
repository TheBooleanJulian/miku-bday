<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIKU-19 — Countdown to 19th Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background">
        <!-- Animated grid background -->
        <div class="grid-background"></div>
        
        <!-- Floating particles -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <div class="content">
        <div class="header">
            <h1 class="title glitch" data-text="MIKU-19">MIKU-19</h1>
            <p class="subtitle">Hatsune Miku's 19th Birthday Celebration</p>
        </div>

        <div class="countdown-container">
            <div class="countdown" id="countdown">
                <div class="time-unit">
                    <span class="time-value" id="days">00</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">Minutes</span>
                </div>
                <div class="time-unit">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">Seconds</span>
                </div>
            </div>

            <div class="event-info">
                <p class="event-date">📅 August 30, 2026 · 3:00 PM SGT</p>
                <p class="event-text">Join us for an unforgettable celebration</p>
            </div>
        </div>

        <div class="footer-text">
            <p>🎂 19 Years of Miku 🎂</p>
            <p style="font-size: 0.9rem; opacity: 0.7;">Organized by Xymiku.39</p>
        </div>
    </div>

    <!-- Easter egg link to schedule (barely visible) -->
    <a href="schedule.html" class="secret-link">schedule</a>

    <script src="script.js"></script>
</body>
</html>
